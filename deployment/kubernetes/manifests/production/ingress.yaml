apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity-platform-ingress
  namespace: production
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - identity-platform.com
        - www.identity-platform.com
      secretName: identity-platform-tls
  rules:
    - host: identity-platform.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: identity-platform-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: identity-platform-web
                port:
                  number: 80
    - host: www.identity-platform.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: identity-platform-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: identity-platform-web
                port:
                  number: 80
